<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
<!--            min-height: 100vh;-->
            display: flex;
            flex-direction: column;
            padding-top: 80px;
        }
        .main-content {
            margin-left: 250px;
<!--            display: flex;-->
<!--            flex: 1;-->
            padding: 25px;
            margin-left: 250px;
        }
        .profile-container {
            flex: 1;
            padding: 30px;
            background: #fff;
            margin: 20px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        h1 {
            color: #444;
            margin-bottom: 25px;
            text-align: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            font-size: 1.8rem;
        }
        .profile-info {
            max-width: 600px;
            margin: 0 auto;
        }
        .info-item {
            margin-bottom: 15px;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #888;
            display: flex;
            align-items: center;
        }
        .info-label {
            color: #666;
            min-width: 140px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .logout-wrapper {
            text-align: center;      /* Выравнивание по центру */
            margin-top: 30px;
        }
        .logout-btn {
            background-color: #dc3545;  /* Красный цвет */
            color: white;
            border: none;
            padding: 12px 40px;         /* Немного больше */
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background-color 0.3s;  /* Плавное изменение */
        }

        .logout-btn:hover {
            background-color: #c82333;  /* Темнее при наведении */
        }
        .info-value {
            color: #333;
            flex: 1;
            font-size: 1.05rem;
        }
        .data {
            background-color: #fafafa;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #eee;
            margin-top: 20px;
        }
        .logout-link {
            color: red;
            text-decoration: none;
            display: block;
            text-align: center;
            margin-top: 20px;
            font-weight: 600;
        }.form-section {
            margin-top: 30px;
            padding: 20px;
            background-color: #fafafa;
            border-radius: 6px;
            border: 1px solid #eee;
        }
        .form-section h2 {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #444;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        .save-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .save-btn:hover {
            background-color: #0056b3;
        }
        .alert {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>

<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>

<div class="main-content">
    <div class="profile-container">
        <h1>Профиль пользователя</h1>
        <div class="profile-info">
            <div th:if="${user != null}" class="data">
                <div class="info-item">
                    <div class="info-label">Имя и Фамилия:</div>
                    <div class="info-value" th:text="${user.firstName + ' ' + user.lastName}"></div>
                </div>
                <div class="info-item">
                    <div class="info-label">Email:</div>
                    <div class="info-value" th:text="${user.email}"></div>
                </div>
<!--                <div class="info-item">-->
<!--                    <div class="info-label">Отдел:</div>-->
<!--                    <div class="info-value" th:text="${user.role}">Разработка</div>-->
<!--                </div>-->
<!--                <div class="info-item">-->
<!--                    <div class="info-label">Роль:</div>-->
<!--                    <div class="info-value" th:text="${user.role}">Лох</div>-->
<!--                </div>-->
            </div>
            <div th:if="${user == null}" class="data">
                <p>Данные пользователя не найдены</p>
            </div>
        </div>
        <div th:if="${param.success}" class="alert alert-success">Данные успешно обновлены!</div>
        <div th:if="${param.error}" class="alert alert-danger">Ошибка при обновлении данных!</div>
        <div class="profile-info">
            <div class="form-section">
                <h2>Редактировать данные</h2>
                <form th:action="@{/profile/update-info}" method="post">
                    <div class="form-group">
                        <label>Имя</label>
                        <input type="text" name="firstName" th:value="${user.firstName}" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Фамилия</label>
                        <input type="text" name="lastName" th:value="${user.lastName}" class="form-control" required>
                    </div>
                    <button type="submit" class="save-btn">Сохранить изменения</button>
                </form>
            </div>
            <div th:if="${param.oldPasswordError}" class="alert alert-danger" style="margin-top: 20px;">
                Текущий пароль введен неверно!
            </div>
            <div th:if="${param.matchError}" class="alert alert-danger" style="margin-top: 20px;">
                Новые пароли не совпадают между собой!
            </div>
            <div th:if="${param.passwordSuccess}" class="alert alert-success" style="margin-top: 20px;">
                Пароль успешно изменен!
            </div>
            <div class="form-section">
                <h2>Смена пароля</h2>
                <form th:action="@{/profile/change-password}" method="post">
                    <div class="form-group">
                        <label>Старый пароль</label>
                        <input type="password" name="oldPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Новый пароль</label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Подтвердите новый пароль</label>
                        <input type="password" name="confirmPassword" class="form-control" required>
                    </div>
                    <button type="submit" class="save-btn" style="background-color: #6c757d;">Обновить пароль</button>
                </form>
            </div>
        </div>
        <div class="logout-wrapper">
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn">Выйти из аккаунта</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
