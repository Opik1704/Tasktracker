<!DOCTYPE html>
<html lang="form-group" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <style>
        .password-error {
        color: #dc3545;
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        border-radius: 4px;
        padding: 8px 12px;
        margin-top: 5px;
        font-size: 0.9em;
    }
    </style>

</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Регистрация</h2>
            <form th:action="@{/registration}" th:object="${userForm}" method="post">
                <div class="form">
                    <label>Имя </label>
                    <input type = "text" th:field="*{firstName}" class = "form-control" required/>
                    <div th:if="${#fields.hasErrors('firstName')}"
                         th:errors="*{firstName}" class="error"></div>
                </div>
                <div class="form-group">
                    <label>Фамилия:</label>
                    <input type="text" th:field="*{lastName}" class="form-control" required/>
                    <div th:if="${#fields.hasErrors('lastName')}"
                         th:errors="*{lastName}" class="error"></div>
                </div>
                <div class="form-group">
                    <label>Электронная почта:</label>
                    <input type="email" th:field="*{email}" class="form-control" required/>
                    <div th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}" class="error"></div>
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" th:field="*{password}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}" class="error"></div>
                </div>
                <div class="form-group">
                    <label>Подтверждение пароля:</label>
                    <input type="password" th:field="*{confirmPassword}" class="form-control"required/>
                    <div th:if="${passwordError}" class="password-error" th:text="${passwordError}"></div>
                </div>

                <div class="form-group">
                    <input type="submit" name="submit" class="btn btn-primary" value="Зарегистрироваться">
                </div>
                <p class="text-center">Уже зарегистрированы? <a th:href="@{/authorization}">Войдите в систему</a>.</p>
            </form>
        </div>
    </div>
</div>
</body>
</html>
