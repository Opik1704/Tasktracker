<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .main-content {
            display: flex;
            flex: 1;
            margin-left: 250px;
            padding: 25px;
        }
        .container {
            flex: 1;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .card {
            margin-bottom: 10px !important;
        }
        .card-body {
            padding: 12px !important;
        }
        .card-title {
            font-size: 1.8rem !important;
            margin-bottom: 8px !important;
        }
        .card-subtitle {
            font-size: 1.1rem !important;
            margin-bottom: 8px !important;
        }
        .priority-low {
            color: #28a745;
            font-weight: bold;
        }
        .priority-medium {
            color: #ffc107;
            font-weight: bold;
        }
        .priority-high {
            color: #fd7e14;
            font-weight: bold;
        }
        .priority-critical {
            color: #dc3545;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            padding: 0 12px 12px 12px;
        }
        .btn-sm {
            padding: 3px 10px;
            font-size: 0.85rem;
        }
        .my-tasks-badge {
            background-color: #17a2b8;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>
<div class = "main-content">
    <div class="container">
        <h1>
            Мои задачи
        </h1>
        <div class="action-panel">
            <div class="search-wrapper">
                <form class="search-form" th:action="@{/user_tasks}" method="get">
                    <input type="text" class="search-input" name="search"
                           placeholder="Поиск среди своих задач..."
                           th:value="${search}">
                    <input type="hidden" name="sort" th:value="${currentSort}">
                    <button type="submit" class="btn-search">🔍 Найти</button>
                    <a th:if="${search}" th:href="@{/user_tasks(sort=${currentSort})}"
                       class="clear-btn">✖</a>
                </form>
            </div>
            <div class="sort-wrapper">
                <div class="sort-dropdown">
                    <button class="sort-btn">
                        <span th:text="${currentSort == 'id_asc' ? 'По ID (новые)' :
                                         currentSort == 'id_desc' ? 'По ID (старые)' :
                                         currentSort == 'deadline' ? 'По дедлайну' :
                                         currentSort == 'priority' ? 'По приоритету' : 'Сортировка'}">
                            Сортировка
                        </span>
                        <span>▼</span>
                    </button>
                    <div class="sort-menu">
                        <a th:href="@{/user_tasks(sort='id_asc', search=${searchQuery})}"
                           th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">
                            По ID (сначала новые)
                        </a>
                        <a th:href="@{/user_tasks(sort='id_desc', search=${searchQuery})}"
                           th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">
                            По ID (сначала старые)
                        </a>
                        <a th:href="@{/user_tasks(sort='deadline', search=${searchQuery})}"
                           th:classappend="${currentSort == 'deadline'} ? 'active' : ''">
                            По дедлайну (ближайшие)
                        </a>
                        <a th:href="@{/user_tasks(sort='priority', search=${searchQuery})}"
                           th:classappend="${currentSort == 'priority'} ? 'active' : ''">
                            По приоритету (Critical → Low)
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div th:each="el : ${tasks}" class = "card mb-2">
            <div class="card-body">
                <h2 class="card-title" th:text="${el.title}"></h2>
                <h6 class="card-subtitle mb-2"
                    th:text="${el.priority}"
                    th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
                </h6>
                <div class="d-flex justify-content-between align-items-center">
          <span>
            <strong>Моя задача</strong>
          </span>
                    <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
                </div>
            </div>

            <div class="btn-group">
                <a th:href="@{/all_tasks/edit/{id}(id=${el.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Редактировать
                </a>
                <form th:action="@{/all_tasks/delete/{id}(id=${el.id})}"
                      method="post"
                      style="display: inline;"
                      onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
