<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
        }
        .action-btn {
            height: 50px;
            padding: 0 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-width: 240px;
        }
        .main-content {
            display: flex;
            flex: 1;
            margin-left: 250px;
            padding: 25px;
        }
        .container {
            flex: 1;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .card {
            margin-bottom: 10px !important;
        }м
        .card-body {
            padding: 12px !important;
        }
        .card-title {
            font-size: 1.8rem !important;
            margin-bottom: 8px !important;
        }
        .card-subtitle {
            font-size: 1.1rem !important;
            margin-bottom: 8px !important;
        }
        .priority-trivial {
            color: #6c757d;
            font-weight: bold;
        }
        .priority-medium {
            color: #ffc107;
            font-weight: bold;
        }
        .priority-high {
            color: #fd7e14;
            font-weight: bold;
        }
        .priority-critical {
            color: #dc3545;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 5px;
            padding: 0 12px 12px 12px;
        }
        .btn-sm {
            padding: 3px 10px;
            font-size: 0.85rem;
        }
        .my-tasks-badge {
            background-color: #17a2b8;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        .my-tasks-badge {
            background-color: #17a2b8;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>
<div class = "main-content">
    <div class="container">
        <h1>
            Мои задачи
            <span class="my-tasks-badge" th:text="${#lists.size(tasks)} + ' задач'"></span>
        </h1>
        <div class="action-panel">
            <div class="search-wrapper">
                <form th:action="@{/user_tasks}" method="get" class="search-form">
                    <input type="text" name="search" class="search-input"
                           placeholder="Поиск по названию или комментарию"
                           th:value="${searchQuery}">
                    <button type="submit" class="btn btn-primary">🔍 Найти</button>
                    <a th:href="@{/user_tasks}" th:if="${searchQuery}"
                       class="btn btn-secondary">Сбросить</a>
                </form>
            </div>
            <div th:if="${#lists.isEmpty(tasks)}" class="alert alert-info text-center">
                <h4>У вас пока нет задач</h4>
                <p>Перейдите в раздел "Все задачи", чтобы создать новую задачу и назначить её себе.</p>
                <a href="/all_tasks" class="btn btn-primary mt-3">Перейти к задачам</a>
            </div>
            <div class="sort-wrapper">
                <div class="sort-dropdown">
                    <button class="action-btn sort-btn">
                        Сортировка <span class="sort-arrow">▼</span>
                    </button>
                    <div class="sort-menu">
                        <a th:href="@{/user_tasks(sort='id_asc')}"
                           th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">
                            Время добавления (новые)
                        </a>
                        <a th:href="@{/user_tasks(sort='id_desc')}"
                           th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">
                            Время добавления (старые)
                        </a>
                        <a th:href="@{/user_tasks(sort='deadline')}"
                           th:classappend="${currentSort == 'deadline'} ? 'active' : ''">
                            Дедлайн
                        </a>
                        <a th:href="@{/user_tasks(sort='priority')}"
                           th:classappend="${currentSort == 'priority'} ? 'active' : ''">
                            Приоритет
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div th:each="el : ${tasks}" class = "card mb-2">
            <div class="card-body">
                <h2 class="card-title" th:text="${el.title}"></h2>
                <h6 class="card-subtitle mb-2"
                    th:text="${el.priority}"
                    th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
                </h6>
                <div class="d-flex justify-content-between align-items-center">
          <span>
            <strong>Моя задача</strong>
          </span>
                    <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
                </div>
            </div>

            <div class="btn-group">
                <a th:href="@{/all_tasks/edit/{id}(id=${el.id})}"
                   class="btn btn-sm btn-outline-primary">
                    Редактировать
                </a>
                <form th:action="@{/all_tasks/delete/{id}(id=${el.id})}"
                      method="post"
                      style="display: inline;"
                      onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Удалить
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
