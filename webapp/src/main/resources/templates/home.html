<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Default Title</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .main-content {
            margin-left: 250px;
            padding: 40px;
            min-height: 100vh;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>
<body>
    <header th:insert="~{blocks/header :: header}"></header>
    <aside th:insert="~{blocks/sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="container">
            <h1>Добро пожаловать, <span th:text="${currentUser != null ? currentUser.name : 'Гость'}"></span>!</h1>
            <p class="lead">Здесь что то будет</p>

        </div>
    </main>
</body>
</html>
