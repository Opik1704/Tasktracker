<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Все задачи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!--  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">-->
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .main-content {
        display: flex;
        flex: 1;
        margin-left: 250px;
        padding: 25px;
    }
    h1 {
        font-size: 3.1rem !important;
        font-weight: bold !important;
        color: #444 !important;
        margin-top: 0;
        margin-bottom: 25px;
    }
    .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
    }
    .action-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .action-btn {
        height: 50px;  /* Увеличена высота */
        padding: 0 35px;  /* Увеличены боковые отступы */
        border: none;
        border-radius: 8px;  /* Чуть больше скругление */
        font-size: 1.15rem;  /* Увеличен размер шрифта */
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;  /* Увеличен промежуток между текстом и иконкой */
        line-height: 1;
        white-space: nowrap;
        transition: all 0.2s;
        min-width: 240px;  /* Еще больше увеличена минимальная ширина */
        letter-spacing: 0.3px;  /* Небольшой интервал между буквами */
    }


    .sort-btn {
        background: #6c757d;
        color: white;
    }

    .sort-btn:hover {
        background: #5a6268;
    }

    .add-btn {
        background-color: #007bff;
        color: white;
    }

    .add-btn:hover {
        background-color: #0069d9;
    }

    .sort-dropdown {
        position: relative;
        display: inline-block;
    }

    .sort-menu {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        min-width: 240px;  /* Теперь совпадает с шириной кнопки */
        background: white;
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        border-radius: 6px;
        z-index: 1000;
        overflow: hidden;
        margin-top: 5px;
    }
    .sort-dropdown {
    position: relative;
    display: inline-block;
}
.sort-dropdown::after {
    content: '';
    position: absolute;
    bottom: -10px; /* Размер мостика */
    left: 0;
    width: 100%;
    height: 10px;
    background: transparent;
}
    .sort-dropdown:hover .sort-menu {
        display: block;
    }

    .sort-menu a {
        color: #333;
        padding: 8px 15px;  /* Уменьшены отступы */
        text-decoration: none;
        display: block;
        border-bottom: 1px solid #eee;
        font-size: 0.95rem;  /* Чуть уменьшен шрифт */
        text-align: left;
        white-space: nowrap;
    }

    .sort-menu a:last-child {
        border-bottom: none;
    }

    .sort-menu a:hover {
        background: #f8f9fa;
    }

    .sort-menu a.active {
        background: #007bff;
        color: white;
    }

    .priority-trivial {
        color: #28a745;
        font-weight: bold;
    }
    .priority-medium {
        color: #ffc107;
        font-weight: bold;
    }
    .priority-high {
        color: #fd7e14;
        font-weight: bold;
    }
    .priority-critical {
        color: #dc3545;
        font-weight: bold;
    }

    .task-meta {
        font-size: 0.9rem;
        color: #6c757d;
    }

    .modal-dialog {
        margin-top: 100px;
    }

    .btn-group {
        display: flex;
        gap: 10px;
        padding: 0 12px 12px 12px;
        justify-content: space-between;
    }

    .btn-edit {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        min-width: 80px;
        text-align: center;
    }

    .btn-edit:hover {
        background-color: #0069d9;
    }

    .btn-delete {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 6px 30px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        flex: 0 1 auto;
        min-width: 100px;
    }

    .btn-delete:hover {
        background-color: #c82333;
    }

    .card {
        margin-bottom: 10px !important;
    }
    .card-body {
        padding: 12px !important;
    }
    .card-title {
        font-size: 1.8rem !important;
        margin-bottom: 8px !important;
        font-weight: bold;
    }
    .card-subtitle {
        font-size: 1.1rem !important;
        margin-bottom: 8px !important;
    }
    .sort-arrow {
        font-size: 14px;
        margin-left: 5px;
    }
    .search-container {
            margin: 20px 0;
            display: flex;
            gap: 0; /* Соединяем инпут и кнопку */
            max-width: 400px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px; /* Скругляем только левые углы */
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #007bff;
        }

        .search-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-left: none; /* Убираем двойную границу между ними */
            padding: 0 15px;
            border-radius: 0 5px 5px 0; /* Скругляем только правые углы */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #e2e6ea;
        }

        .search-btn svg {
            width: 16px;
            height: 16px;
            fill: #555;
        }
      .favorite-btn {
          background: none;
          border: none;
          font-size: 2.2rem;
          cursor: pointer;
          transition: transform 0.2s;
          padding: 0;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .favorite-btn:hover {
          transform: scale(1.2);
      }
      .star-filled {
          color: #ffc107;
      }
      .star-empty {
          color: #ccc;
      }
      .title-wrapper {
          display: flex;
          align-items: center;
          justify-content: flex-start;
      }
    .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: #007bff;
        color: white;
        border-radius: 50%;
        display: none; /* Скрипт изменит это на 'flex' при скролле */
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        border: none;
        z-index: 9999; /* Чтобы кнопка была поверх всех карточек */
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .back-to-top:hover {
        background-color: #0056b3;
        transform: translateY(-5px);
        color: white;
    }
    /* --- Стили для бейджей статусов (добавить в style) --- */
    .status-badge {
        padding: 5px 12px;
        border-radius: 20px; /* Скругленные края (pill) */
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase; /* Все буквы заглавные */
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        white-space: nowrap;
    }

    /* Цвета для каждого статуса */
    .status-new {
        background-color: #e0f2fe; /* Светло-синий */
        color: #0369a1;
        border: 1px solid #bae6fd;
    }

    .status-in_progress {
        background-color: #fffbeb; /* Светло-желтый */
        color: #a16207;
        border: 1px solid #fef3c7;
    }

    .status-testing {
        background-color: #ede9fe; /* Светло-фиолетовый */
        color: #6d28d9;
        border: 1px solid #ddd6fe;
    }

    .status-review {
        background-color: #ffedfa; /* Светло-розовый */
        color: #be185d;
        border: 1px solid #fbcfe8;
    }

    .status-completed {
        background-color: #dcfce7; /* Светло-зеленый */
        color: #15803d;
        border: 1px solid #bbf7d0;
    }
    html {
        scroll-behavior: smooth;
    }
  </style>
</head>

<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>

<div class="main-content">
  <div class="container">
    <div class="header-actions">
      <h1>Все задачи</h1>
      <div class="action-buttons">
        <div class="sort-dropdown">
          <button class="action-btn sort-btn">
            Сортировка <span class="sort-arrow">▼</span>
          </button>
          <div class="sort-menu">
            <a th:href="@{/all-tasks(sort='id_desc')}"
               th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">
              Время добавления (новые)
            </a>
            <a th:href="@{/all-tasks(sort='id_asc')}  "
               th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">
              Время добавления (старые)
            </a>
            <a th:href="@{/all-tasks(sort='deadline')} "
               th:classappend="${currentSort == 'deadline'} ? 'active' : ''">
              Дедлайн
            </a>
            <a th:href="@{/all-tasks(sort='priority')}  "
               th:classappend="${currentSort == 'priority'} ? 'active' : ''">
              Приоритет
            </a>
            <a th:href="@{/all-tasks(sort='status_asc')}"
               th:classappend="${currentSort == 'status_asc'} ? 'active' : ''">
              Статус (Новые)
            </a>
            <a th:href="@{/all-tasks(sort='status_desc')}"
               th:classappend="${currentSort == 'status_desc'} ? 'active' : ''">
              Статус (Завершенные)
            </a>
          </div>
        </div>
        <button class="action-btn add-btn" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          + Добавить задачу
        </button>
      </div>
    </div>
    <div class="search-container" id="task-list">
      <form th:action="@{/all-tasks}" method="get" style="display: flex; width: 100%;">
        <input type="text" name="search" class="search-input"
               th:value="${searchQuery}" placeholder="Поиск по названию...">
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
          <span style="margin-left: 5px; font-weight: 500; color: #444;">Найти</span>
        </button>
      </form>
    </div>
    <div th:if="${#lists.isEmpty(tasks)}"
         style="text-align: center; padding: 50px; background: white; border-radius: 8px; border: 1px dashed #ccc; margin-top: 20px; width: 100%;">
      <h3 style="color: #6c757d;">Задача не найдена</h3>
      <p style="color: #999;">Попробуйте изменить запрос или <a th:href="@{/all-tasks}" style="color: #007bff; text-decoration: none;">сбросить поиск</a></p>
    </div>
    <div th:unless="${#lists.isEmpty(tasks)}" th:each="el : ${tasks}" class="card mb-2" th:id="'task-' + ${el.id}">
      <div class="card-body">
        <div class="title-wrapper mb-2" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
            <h2 class="card-title mb-0" th:text="${el.title}" style="margin-right: 0 !important;"></h2>

            <span class="status-badge"
                  th:classappend="'status-' + ${#strings.toLowerCase(el.status)}"
                  th:text="${el.status}">
            </span>
          </div>
          <form th:action="@{/favorites/toggle/{id}(id=${el.id})}" method="post">
            <button type="submit" class="favorite-btn" style="margin-right: 0;">
              <span th:if="${currentUser != null and currentUser.favouriteTasks.contains(el)}" class="star-filled">★</span>
              <span th:unless="${currentUser != null and currentUser.favouriteTasks.contains(el)}" class="star-empty">☆</span>
            </button>
          </form>
        </div>
        <h6 class="card-subtitle mb-3" th:text="${el.priority}"
            th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
        </h6>

        <div class="d-flex justify-content-between align-items-center mb-3">
        <span>
            <strong>Исполнитель:</strong>
            <span th:if="${users != null and !#lists.isEmpty(users)}">
                <span th:each="user : ${users}" th:if="${user.id == el.artistId}"
                      th:text="${user.firstName + ' ' + user.lastName}"></span>
            </span>
            <span th:if="${el.artistId == null}">Не назначен</span>
        </span>
          <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
        </div>

        <div class="btn-group-container d-flex gap-2">
          <button type="button"
                  class="btn-edit"
                  data-bs-toggle="modal"
                  data-bs-target="#editTaskModal"
                  th:data-task-id="${el.id}"
                  th:data-task-title="${el.title}"
                  th:data-task-priority="${el.priority}"
                  th:data-task-artist="${el.artistId}"
                  th:data-task-deadline="${#temporals.format(el.deadline, 'yyyy-MM-dd''T''HH:mm')}"
                  th:data-task-comment="${el.comment}"
                  th:data-current-sort="${currentSort}"
                  onclick="fillEditModal(this)">
            Редактировать
          </button>
          <form th:action="@{/all-tasks/delete/{id}(id=${el.id}, sort=${currentSort})}"
                method="post"
                style="display: inline;"
                onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
            <button type="submit" class="btn-delete" style="padding: 6px 20px;">
              Удалить
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить задачу</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form th:action="@{/all-tasks}" method="post">
          <div class="mb-3">
            <label class="form-label">Название задачи</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <select name="priority" class="form-select">
              <option value="TRIVIAL">Низкий</option>
              <option value="MEDIUM">Средний</option>
              <option value="HIGH">Высокий</option>
              <option value="CRITICAL">Критичный</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Исполнитель</label>
            <select name="artistId" class="form-select" required>
              <option value="" disabled selected>Выберите исполнителя</option>
              <option th:each="user :${users}"
                      th:value="${user.id}"
                      th:text="${user.firstName + ' ' + user.lastName}">
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Дедлайн</label>
            <input type="datetime-local" name="deadline" min="2024-01-01T00:00" max="2099-12-31T23:59" required>          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="2" placeholder="Опишите задачу"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
      </div>
    </div>
  </div>
</div>
<button onclick="scrollToTop()" id="backToTopBtn" class="back-to-top" title="Наверх">
  ↑
</button>
<div th:insert="blocks/modals :: editTaskModal"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function fillEditModal(button) {
      document.getElementById('editTaskId').value = button.getAttribute('data-task-id');
      document.getElementById('editTaskTitle').value = button.getAttribute('data-task-title');
      document.getElementById('editTaskPriority').value = button.getAttribute('data-task-priority');
      document.getElementById('editTaskArtist').value = button.getAttribute('data-task-artist');
      document.getElementById('editTaskDeadline').value = button.getAttribute('data-task-deadline');
      document.getElementById('editTaskComment').value = button.getAttribute('data-task-comment') || '';
  }
    const mybutton = document.getElementById("backToTopBtn");

    window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            mybutton.style.display = "flex";
        } else {
            mybutton.style.display = "none";
        }
    };

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    function clearEditFile() {
    const fileInput = document.getElementById('edit-file-input');
    const preview = document.getElementById('edit-preview');
    if (fileInput) fileInput.value = '';
    if (preview) preview.classList.add('d-none');
}

// Слушатель вставки (Ctrl + V)
document.addEventListener('paste', (event) => {
    // Проверяем, открыта ли модалка в данный момент
    const modal = document.getElementById('editTaskModal');
    if (!modal.classList.contains('show')) return;

    const items = (event.clipboardData || event.originalEvent.clipboardData).items;
    for (const item of items) {
        if (item.kind === 'file') {
            const blob = item.getAsFile();
            handleFileSelection(blob, 'edit');
        }
    }
});

  function handleFileSelection(file, type) {
      const fileInput = document.getElementById(type + '-file-input');
      const preview = document.getElementById(type + '-preview');
      const previewImg = document.getElementById(type + '-preview-img');
      const fileName = document.getElementById(type + '-file-name');

      const dataTransfer = new DataTransfer();
      dataTransfer.items.add(file);
      fileInput.files = dataTransfer.files;

      fileName.innerText = file.name || "clipboard_image.png";
      preview.classList.remove('d-none');

      if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (e) => previewImg.src = e.target.result;
          reader.readAsDataURL(file);
      }
  }

</script>

</body>
</html>
