<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Все задачи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .main-content {
        display: flex;
        flex: 1;
        margin-left: 250px;
        padding: 25px;
    }
    h1 {
        font-size: 3.1rem !important;
        font-weight: bold !important;
        color: #444 !important;
        margin-top: 0;
        margin-bottom: 25px;
    }
    .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
    }
    .action-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .action-btn {
        height: 50px;  /* Увеличена высота */
        padding: 0 35px;  /* Увеличены боковые отступы */
        border: none;
        border-radius: 8px;  /* Чуть больше скругление */
        font-size: 1.15rem;  /* Увеличен размер шрифта */
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;  /* Увеличен промежуток между текстом и иконкой */
        line-height: 1;
        white-space: nowrap;
        transition: all 0.2s;
        min-width: 240px;  /* Еще больше увеличена минимальная ширина */
        letter-spacing: 0.3px;  /* Небольшой интервал между буквами */
    }


    .sort-btn {
        background: #6c757d;
        color: white;
    }

    .sort-btn:hover {
        background: #5a6268;
    }

    .add-btn {
        background-color: #007bff;
        color: white;
    }

    .add-btn:hover {
        background-color: #0069d9;
    }

    .sort-dropdown {
        position: relative;
        display: inline-block;
    }

    .sort-menu {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        min-width: 240px;  /* Теперь совпадает с шириной кнопки */
        background: white;
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        border-radius: 6px;
        z-index: 1000;
        overflow: hidden;
        margin-top: 5px;
    }
    .sort-dropdown {
    position: relative;
    display: inline-block;
}
.sort-dropdown::after {
    content: '';
    position: absolute;
    bottom: -10px; /* Размер мостика */
    left: 0;
    width: 100%;
    height: 10px;
    background: transparent;
}
    .sort-dropdown:hover .sort-menu {
        display: block;
    }

    .sort-menu a {
        color: #333;
        padding: 8px 15px;  /* Уменьшены отступы */
        text-decoration: none;
        display: block;
        border-bottom: 1px solid #eee;
        font-size: 0.95rem;  /* Чуть уменьшен шрифт */
        text-align: left;
        white-space: nowrap;
    }

    .sort-menu a:last-child {
        border-bottom: none;
    }

    .sort-menu a:hover {
        background: #f8f9fa;
    }

    .sort-menu a.active {
        background: #007bff;
        color: white;
    }

    .priority-trivial {
        color: #28a745;
        font-weight: bold;
    }
    .priority-medium {
        color: #ffc107;
        font-weight: bold;
    }
    .priority-high {
        color: #fd7e14;
        font-weight: bold;
    }
    .priority-critical {
        color: #dc3545;
        font-weight: bold;
    }

    .task-meta {
        font-size: 0.9rem;
        color: #6c757d;
    }

    .modal-dialog {
        margin-top: 100px;
    }

    .btn-group {
        display: flex;
        gap: 10px;
        padding: 0 12px 12px 12px;
        justify-content: space-between;
    }

    .btn-edit {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        min-width: 80px;
        text-align: center;
    }

    .btn-edit:hover {
        background-color: #0069d9;
    }

    .btn-delete {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 6px 30px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        flex: 0 1 auto;
        min-width: 100px;
    }

    .btn-delete:hover {
        background-color: #c82333;
    }

    .card {
        margin-bottom: 10px !important;
    }
    .card-body {
        padding: 12px !important;
    }
    .card-title {
        font-size: 1.8rem !important;
        margin-bottom: 8px !important;
        font-weight: bold;
    }
    .card-subtitle {
        font-size: 1.1rem !important;
        margin-bottom: 8px !important;
    }

    /* Стрелка вниз на кнопке сортировки */
    .sort-arrow {
        font-size: 14px;
        margin-left: 5px;
    }
  </style>
</head>

<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>

<div class="main-content">
  <div class="container">
    <div class="header-actions">
      <h1>Все задачи</h1>
      <div class="action-buttons">
        <div class="sort-dropdown">
          <button class="action-btn sort-btn">
            Сортировка <span class="sort-arrow">▼</span>
          </button>
          <div class="sort-menu">
            <a th:href="@{/all_tasks(sort='id_asc')}"
               th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">
              Время добавления (новые)
            </a>
            <a th:href="@{/all_tasks(sort='id_desc')}"
               th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">
              Время добавления (старые)
            </a>
            <a th:href="@{/all_tasks(sort='deadline')}"
               th:classappend="${currentSort == 'deadline'} ? 'active' : ''">
              Дедлайн
            </a>
            <a th:href="@{/all_tasks(sort='priority')}"
               th:classappend="${currentSort == 'priority'} ? 'active' : ''">
              Приоритет
            </a>
          </div>
        </div>
        <button class="action-btn add-btn" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          + Добавить задачу
        </button>
      </div>
    </div>
    <div th:each="el : ${tasks}" class="card mb-2">
      <div class="card-body">
        <h2 class="card-title" th:text="${el.title}"></h2>
        <h6 class="card-subtitle mb-2" th:text="${el.priority}"
            th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
        </h6>
        <div class="d-flex justify-content-between align-items-center">
          <span>
            <strong>Исполнитель:</strong>
            <span th:if="${users != null and !#lists.isEmpty(users)}">
              <span th:each="user : ${users}" th:if="${user.id == el.artistId}"
                    th:text="${user.firstName + ' ' + user.lastName}"></span>
            </span>
            <span th:if="${users == null or #lists.isEmpty(users)}">Не назначен</span>
          </span>
          <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
        </div>
        <div class="btn-group">
          <button type="button"
                  class="btn-edit"
                  data-bs-toggle="modal"
                  data-bs-target="#editTaskModal"
                  th:data-task-id="${el.id}"
                  th:data-task-title="${el.title}"
                  th:data-task-priority="${el.priority}"
                  th:data-task-artist="${el.artistId}"
                  th:data-task-deadline="${#temporals.format(el.deadline, 'yyyy-MM-dd''T''HH:mm')}"
                  th:data-task-comment="${el.comment}"
                  th:data-current-sort="${currentSort}"
                  onclick="fillEditModal(this)">
            Редактировать
          </button>
          <form th:action="@{/all_tasks/delete/{id}(id=${el.id}, sort=${currentSort})}"
                method="post"
                style="display: inline;"
                onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
            <button type="submit" class="btn-delete">
              Удалить
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить задачу</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form th:action="@{/all_tasks}" method="post">
          <div class="mb-3">
            <label class="form-label">Название задачи</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <select name="priority" class="form-select">
              <option value="TRIVIAL">Низкий</option>
              <option value="MEDIUM">Средний</option>
              <option value="HIGH">Высокий</option>
              <option value="CRITICAL">Критичный</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Исполнитель</label>
            <select name="artistId" class="form-select" required>
              <option value="" disabled selected>Выберите исполнителя</option>
              <option th:each="user :${users}"
                      th:value="${user.id}"
                      th:text="${user.firstName + ' ' + user.lastName}">
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Дедлайн</label>
            <input type="datetime-local" name="deadline" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="2" placeholder="Опишите задачу"></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
      </div>
    </div>
  </div>
</div>
<div th:insert="blocks/modals :: editTaskModal"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  function fillEditModal(button) {
      document.getElementById('editTaskId').value = button.getAttribute('data-task-id');
      document.getElementById('editTaskTitle').value = button.getAttribute('data-task-title');
      document.getElementById('editTaskPriority').value = button.getAttribute('data-task-priority');
      document.getElementById('editTaskArtist').value = button.getAttribute('data-task-artist');
      document.getElementById('editTaskDeadline').value = button.getAttribute('data-task-deadline');
      document.getElementById('editTaskComment').value = button.getAttribute('data-task-comment') || '';
  }
</script>

</body>
</html>
