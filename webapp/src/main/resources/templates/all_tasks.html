<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Все задачи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .main-content {
        display: flex;
        flex: 1;
        margin-left: 250px;
        padding: 25px;
    }
     .card {
        margin-bottom: 10px !important;
    }
    .card-body {
        padding: 12px !important;
    }
    .card-title {
        font-size: 1.8rem !important;
        margin-bottom: 8px !important;
        font-weight: bold;
    }
    .card-subtitle {
        font-size: 1.1rem !important;
        margin-bottom: 8px !important;
    }
     .priority-low {
        color: #28a745;
        font-weight: bold;
    }
    .priority-medium {
        color: #ffc107;
        font-weight: bold;
    }
    .priority-high {
        color: #fd7e14;
        font-weight: bold;
    }
    .priority-critical {
        color: #dc3545;
        font-weight: bold;
    }
    .task-meta {
        font-size: 0.9rem;
        color: #6c757d;
    }
    .btn-group {
        display: flex;
        gap: 5px;
        padding: 0 12px 12px 12px;  /* Отступы как у card-body */
    }
    .btn-sm {
        padding: 3px 10px;
        font-size: 0.85rem;
    }
  </style>
</head>

<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>

<div class="main-content">
  <div class = "container">
    <h1>Все задачи</h1>
    <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#addTaskModal">+ Добавить задачу</button>
    <div th:each="el : ${tasks}" class="card mb-2">
      <div class="card-body">
        <h2 class="card-title" th:text="${el.title}"></h2>
        <h6 class="card-subtitle mb-2"  th:text="${el.priority}"
              th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
        </h6>
        <div class="d-flex justify-content-between align-items-center">
          <span>
              <strong>Исполнитель:</strong>
              <span th:if="${users != null and !#lists.isEmpty(users)}">
                <span th:each="user : ${users}" th:if="${user.id == el.artistId}"
                      th:text="${user.firstName + ' ' + user.lastName}">
                </span>
            </span>
            <span th:if="${users == null or #lists.isEmpty(users)}">Не назначен</span>
            </span>
          <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
        </div>
        <div class="btn-group">
          <a th:href="@{/all_tasks/edit/{id}(id=${el.id})}"
             class="btn btn-sm btn-outline-primary me-2">
            Редактировать
          </a>
          <form th:action="@{/all_tasks/delete/{id}(id=${el.id})}"
                method="post"
                style="display: inline;"
                onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
            <button type="submit" class="btn btn-sm btn-outline-danger">
              Удалить
            </button>
          </form>
        </div>
      </div>
    </div>
<!--    <div class="btn-group">-->
<!--      <a th:href="@{/all_tasks/edit/{id}(id=${el.id})}"-->
<!--         class="btn btn-sm btn-outline-primary me-2">-->
<!--        Редактировать-->
<!--      </a>-->
<!--      <form th:action="@{/all_tasks/delete/{id}(id=${el.id})}"-->
<!--            method="post"-->
<!--            style="display: inline;"-->
<!--            onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">-->
<!--        <button type="submit" class="btn btn-sm btn-outline-danger">-->
<!--          Удалить-->
<!--        </button>-->
<!--      </form>-->
<!--    </div>-->
  </div>
</div>

<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить задачу</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form th:action="@{/all_tasks}" method="post">
          <div class="mb-3">
            <label class="form-label">Название задачи</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <div style="display: flex; align-items: center; gap: 10px;">
              <select name="priority" class="form-select">
                <option value="LOW">Низкий</option>
                <option value="MEDIUM">Средний</option>
                <option value="HIGH">Высокий</option>
                <option value="CRITICAL">Критичный</option>
              </select>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Исполнитель</label>
            <select name="artistId" class="form-select" required>
              <option value="" disabled selected>Выберите исполнителя</option>
              <option th:each="user :${users}"
                      th:value="${user.id}"
                      th:text="${user.firstName + ' ' + user.lastName}">
              </option>
            </select>
          </div>
<!--          <div class="mb-3">-->
<!--            <label class="form-label">Исполнитель</label>-->
<!--            <select name="artisdid" class="form-select" required>-->
<!--              <option value="" disabled selected>Выберите исполнителя</option>-->
<!--              <option th:each="user : ${users}"-->
<!--                      th:value="${user.id}"-->
<!--                      th:text="${user.name}">-->
<!--              </option>-->
<!--            </select>-->
<!--          </div>-->
          <div class="mb-3">
            <label class="form-label">Дедлайн</label>
            <input type="datetime-local" name="deadline" class="form-control" required
                   min="1900-01-01T00:00"
                   max="2100-01-01T00:00"
                   th:value="${#temporals.format(LocalDateTime.now(), 'yyyy-MM-dd\'T\'HH:mm')}">
          </div>
          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="2" placeholder="Опишите задачу" ></textarea>
          </div>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
