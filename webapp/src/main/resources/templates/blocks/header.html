<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <div>
        <nav class="horizontal-nav">
            <div class = "logo">
                <a href="/"> Главная </a>
            </div>
            <ul class = "right-head">
                <li class="bell-item">
                    <a href="/notifications" class="bell-link">
                        <i class="bi bi-bell"></i>
                        <span class="badge" th:if="${notificationsCount > 0}" th:text="${notificationsCount}"></span>
                    </a>
                </li>
                <li><a href="#"> + (новая задача проект)</a></li>
                <li><a href="profile"> Профиль </a></li>
            </ul>
        </nav>
    </div>
    <style>

        .horizontal-nav{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        display:flex;
        justify-content: space-between;
        align-items: center;
        background-color:#696969;
        border-radius:5px;
        border-radius: 0;
        box-sizing: border-box;
        margin: 0;
        padding: 0 20px;
        z-index: 2000;
        }
        body {
            margin: 0;
            padding-top: 80px;
            background: #f5f6fa;
        }
        .logo {
            display: flex;
            align-items: center;
            line-height: 1;
            position: relative;
            top: 0;
            margin: auto 0;
        }
        .logo a {
          color: white !important;
          font-size: 30px !important;
          font-weight: bold !important;
          text-decoration: none !important;
        }
        .right-head{
        display:flex;
        list-style:none;
        margin:0;
        padding:0;
        gap:20px;
        }
        .right-head a:focus {
            background-color: transparent !important;
            outline: none;
        }
        .right-head a:active {
        background-color: transparent;
        color: white;
        }
        .right-head li{
            display: flex;
        }
        .right-head a{
            color:white;
            text-decoration: none;
            display: flex;
            align-items: !important;
            white-space: nowrap;
        }
        .right-head a:hover {
            background-color: #555;
            border-radius: 3px;
        }
        .badge {
        position: absolute;
        top: -5px;
        right: -8px;
        background-color: #dc3545; /* Красный */
        color: white;
        border-radius: 50%;
        padding: 2px 6px;
        font-size: 11px;
        font-weight: bold;
        line-height: 1;
    }
    </style>
</div>
