<div th:fragment="header" xmlns:th="http://www.thymeleaf.org">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <div>
        <nav class="horizontal-nav">
            <div class = "logo">
                <a href="/"> Главная </a>
            </div>
            <ul class = "right-head">
                <li class="nav-item dropdown bell-item">
                    <a class="nav-link bell-link" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-bell" style="color: white; font-size: 1.5rem;"></i>
                        <span class="badge"
                              th:if="${notificationsCount != null and notificationsCount > 0}"
                              th:text="${notificationsCount}">
                        </span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" style="min-width: 300px; max-height: 400px; overflow-y: auto;">
                        <li><h6 class="dropdown-header">Уведомления</h6></li>
                        <li><hr class="dropdown-divider"></li>

                        <li th:if="${#lists.isEmpty(lastNotifications)}">
                            <span class="dropdown-item text-muted text-center">Уведомлений пока нет</span>
                        </li>

                        <li th:each="note : ${lastNotifications}">
                            <div class="dropdown-item d-flex flex-column p-3" style="grey-space: normal; border-bottom: 1px solid #eee;">
                                <span th:text="${note.message}" style="font-size: 0.9rem; line-height: 1.2;"></span>
                                <small class="text-muted mt-1" th:text="${#temporals.format(note.createdAt, 'dd.MM HH:mm')}"></small>
                            </div>
                        </li>

                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <a th:href="@{/notifications/mark-all-read}" class="dropdown-item text-center">Прочитать всё</a>
                        </li>
                    </ul>
                </li>
                <li><a href="#"> + (новая задача проект)</a></li>
                <div class="user-profile-header" style="display: flex; align-items: center; gap: 10px;">
                    <a th:href="@{/profile}">
                        <img th:if="${userAvatar != null}"
                             th:src="@{'/uploads/avatars/' + ${userAvatar}}"
                             class="avatar-circle">

                        <i th:unless="${userAvatar != null}"
                           class="bi bi-person-circle"
                           style="font-size: 2rem; color: white;"></i>
                    </a>
                </div>
                <li><a href="profile"> Профиль </a></li>
            </ul>
        </nav>
    </div>
    <style>

        .horizontal-nav{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 80px;
        display:flex;
        justify-content: space-between;
        align-items: center;
        background-color:#696969;
        border-radius:5px;
        border-radius: 0;
        box-sizing: border-box;
        margin: 0;
        padding: 0 20px;
        z-index: 2000;
        }
        body {
            margin: 0;
            padding-top: 80px;
            background: #f5f6fa;
        }
        .logo {
            display: flex;
            align-items: center;
            line-height: 1;
            position: relative;
            top: 0;
            margin: auto 0;
        }
        .logo a {
          color: white !important;
          font-size: 30px !important;
          font-weight: bold !important;
          text-decoration: none !important;
        }
        .right-head {
            display: flex;
            align-items: center; /* Центрирует всё по вертикали */
            list-style: none;
            margin: 0;
            padding: 0;
            gap: 25px; /* Расстояние между элементами */
        }
        .right-head a:focus {
            background-color: transparent !important;
            outline: none;
        }
        .right-head a:active {
        background-color: transparent;
        color: white;
        }
        .right-head li{
            display: flex;
        }
        .right-head a{
            color:white;
            text-decoration: none;
            display: flex;
            align-items: !important;
            white-space: nowrap;
        }
        .right-head a:hover {
            background-color: #555;
            border-radius: 3px;
        }
        .badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background-color: #dc3545; /* Красный */
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: bold;
            line-height: 1;
    }
    .custom-dropdown-header {
            display: block;
            padding: 10px 20px;
            margin-bottom: 0;
            font-size: 1.2rem !important; /* Увеличили размер */
            font-weight: 800 !important;   /* Сделали максимально жирным */
            color: #212529;               /* Глубокий темный цвет */
            text-transform: uppercase;    /* Все буквы заглавные (по желанию) */
            letter-spacing: 0.5px;        /* Немного раздвинули буквы */
        }
       .dropdown-item:active {
        background-color: #f8f9fa;
        color: #000;
        }
        .bell-item {
        position: relative;
        display: flex;
        align-items: center;
    }
        .bell-item .dropdown-menu {
            border: none;
            border-radius: 8px;
            margin-top: 10px !important;
        }
    .dropdown-menu a.dropdown-item {
            color: #333 !important;
            padding: 10px 20px;
            text-align: center;
            display: block;
            width: 100%;
        }

        .dropdown-menu a.dropdown-item:hover {
            background-color: #f8f9fa !important; /* Светло-серый фон при наведении */
            color: #000 !important;
            text-decoration: none;
        }

        .dropdown-menu li {
            display: block; /* Сбрасываем flex, который мы дали в .right-head li */
        }
    </style>
</div>
