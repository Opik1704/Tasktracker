<div th:fragment="sidebar" xmlns:th="http://www.thymeleaf.org">
    <div class="sidebar">
        <nav>
            <ul>
                <li><a href="/user-tasks" data-page="my-tasks">Мои задачи</a></li>
                <li><a href="/all-tasks" data-page="all-tasks">Все задачи(тупа список)</a></li>
                <li><a href="my-projects" data-page="my-projects">Мои проекты(при нажатии на проект будет кабан доска для проекта конкретного)</a></li>
                <li th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                    <a href="/admin" data-page="admin">Панель админа</a>
                </li>
            </ul>
        </nav>
    </div>
    <style>
        .sidebar {
           text-decoration: none;
           margin-top: 80px;
           height: 100%;
           width: 250px;
           background-color: #bbbbbb;
           color: grey;
           padding: 20px 0;
           position: fixed;
           overflow-y: auto;
           top: 0;
           left: 0;
           transition: all 0.5s ease;
           font-size: 20px;
           font-weight: bold;
           line-height: 1.5;
           z-index: 1000;
       }

       .sidebar * {
           margin: 0;
           padding: 0;
           box-sizing: border-box;
       }
       .sidebar nav ul {
           margin-top: 10px;
       }
       .sidebar nav ul li {
           margin-bottom: 30px;
       }

       .sidebar a {
           display: block;
           padding: 12px 20px;
           color: #333 !important;
           transition: all 0.3s ease;
           border-left: 4px solid transparent;
           text-decoration: none !important;  <!-- ДОБАВИТЬ ЭТУ СТРОКУ -->
       }
       .sidebar a.active {
           background-color: #9e9e9e;
           color: white !important;
       }

       .sidebar a:hover:not(.active) {
           background-color: #9e9e9e;
           color: white !important;
       }
       .sidebar a:active {
           background-color: inherit;
       }
       body {
           background: #f5f6fa;
       }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const links = document.querySelectorAll('.sidebar a');
            const currentPath = window.location.pathname;
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    e.preventDefault();
                    links.forEach(item => item.classList.remove('active'));
                    this.classList.add('active');
                    const page = this.getAttribute('data-page');
                    console.log('Переход на страницу:', page)
                    const href = this.getAttribute('href');
                    if (href && href !== '#') {
                        window.location.href = href;
                    }
                });
                const href = link.getAttribute('href');
                if (href && href !== '#' && currentPath.includes(href)) {
                    link.classList.add('active');
                }
            });
            const href = link.getAttribute('href');
            if (href && href !== '#' && currentPath.includes(href)) {
                link.classList.add('active');
            }
        });
    </script>
</div>
