spring.application.name=webapp
server.port = 1024

spring.datasource.url=jdbc:postgresql://localhost:1408/tasks
spring.datasource.username=postgres
spring.datasource.password=qwerty123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgresSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

logging.file.name=logs/taskmanager.log
logging.file.path=logs
logging.level.com.site.webapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n