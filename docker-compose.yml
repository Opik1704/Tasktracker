version: '3.8'
services:
  app:
    build: ./webapp
    container_name: taskmanager-app
    ports:
      - "1024:1024"
    volumes:
      - ./task-data/uploads:/app/uploads_tasks
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: 1024
      APP_UPLOAD_DIR: /app/uploads_tasks
    depends_on:
      - postgres
    restart: always
  postgres:
    image: postgres:16
    container_name: taskmanager-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "1408:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
volumes:
  postgres_data: