server:
  port: 1024
  servlet:
    session:
      cookie:
        secure: false
app:
  upload:
    dir: ./uploads_tasks
upload:
  path: uploads

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tasktracker_dev}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email,profile
  aws:
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      access-key: ${S3_ACCESS_KEY:minioadmin}
      secret-key: ${S3_SECRET_KEY:minioadmin}
      bucket-name: ${S3_BUCKET_NAME:taskmanager-uploads}
      region: ${S3_REGION:ru-central1}
  logging:
    file:
      name: logs/taskmanager-dev.log
      path: logs
  level:
    com.site.webapp: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%X{userEmail:-anon}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n"