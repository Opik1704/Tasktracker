spring.application.name=webapp

app.upload.dir=${APP_UPLOAD_DIR:/app/uploads_tasks}
upload.path=uploads

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=${PORT:1024}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.table-name=SPRING_SESSION


aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minioadmin}
aws.s3.secret-key=${S3_SECRET_KEY:minioadmin}
aws.s3.bucket-name=${S3_BUCKET_NAME:taskmanager-uploads}
aws.s3.region=${S3_REGION:ru-central1}


logging.file.name=logs/taskmanager.log
logging.file.path=logs
logging.level.com.site.webapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG


#logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%X{userEmail:-anon}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n
