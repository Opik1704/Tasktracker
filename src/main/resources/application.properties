spring.application.name=webapp

# ???? ????????
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads_tasks}
upload.path=uploads

# ???????????? Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ?????? ? ???????? ?????? (PostgreSQL)
server.port=${PORT:1024}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true

# ??? ?????????? HikariCP
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

# ???????? Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ?????? Spring
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=never
spring.session.jdbc.table-name=SPRING_SESSION

# OAuth2 Google Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# S3 / MinIO
aws.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
aws.s3.access-key=${S3_ACCESS_KEY:minioadmin}
aws.s3.secret-key=${S3_SECRET_KEY:minioadmin}
aws.s3.bucket-name=${S3_BUCKET_NAME:taskmanager-uploads}
aws.s3.region=${S3_REGION:ru-central1}

# ????????? ????????
app.avatar.allowed-types=image/jpeg,image/png,image/webp
app.avatar.allowed-extensions=jpg,jpeg,png,webp
app.avatar.min-dimension=64
app.avatar.max-dimension=4096

# ????????? attachment
app.attachment.max-size=15MB
app.attachment.forbidden-extensions=exe,bat,cmd,sh,php,js,jar,vbs,scr,cgi,pl
app.attachment.allowed-types.pdf=application/pdf
app.attachment.allowed-types.jpg=image/jpeg
app.attachment.allowed-types.jpeg=image/jpeg
app.attachment.allowed-types.png=image/png
app.attachment.allowed-types.webp=image/webp
app.attachment.allowed-types.doc=application/msword
app.attachment.allowed-types.docx=application/vnd.openxmlformats-officedocument.wordprocessingml.document
app.attachment.allowed-types.xls=application/vnd.ms-excel
app.attachment.allowed-types.xlsx=application/vnd.openxmlformats-officedocument.spreadsheetml.sheet


# ?????????? Cron
app.scheduling.cron.weekly-plan=0 0 9 * * MON
app.scheduling.cron.daily-plan=0 0 9 * * *
app.scheduling.cron.urgent-reminders=0 0 * * * *
app.scheduling.cron.cleanup-notifications=0 0 2 * * *

# ??????????? ???? (????????? ? 0 ?? 2)
app.async.core-pool-size=4

# ?????????? ????????? ???? ?????
app.workload.max-active-tasks=5
app.workload.deadline-days=7


# ????????????
logging.file.name=logs/taskmanager.log
logging.file.path=logs
logging.level.com.site.webapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.flywaydb=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId}] [%X{userEmail:-anon}] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%X{userId}] %-5level - %msg%n

