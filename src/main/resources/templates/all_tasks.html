<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8" />
  <title>Все задачи</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<!--  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">-->
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .main-content {
        display: flex;
        flex: 1;
        margin-left: 250px;
        padding: 25px;
    }
    h1 {
        font-size: 3.1rem !important;
        font-weight: bold !important;
        color: #444 !important;
        margin-top: 0;
        margin-bottom: 25px;
    }
    .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px;
    }
    .action-buttons {
        display: flex;
        gap: 12px;
        align-items: center;
    }
    .action-btn {
        height: 50px;  /* Увеличена высота */
        padding: 0 35px;  /* Увеличены боковые отступы */
        border: none;
        border-radius: 8px;  /* Чуть больше скругление */
        font-size: 1.15rem;  /* Увеличен размер шрифта */
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;  /* Увеличен промежуток между текстом и иконкой */
        line-height: 1;
        white-space: nowrap;
        transition: all 0.2s;
        min-width: 240px;  /* Еще больше увеличена минимальная ширина */
        letter-spacing: 0.3px;  /* Небольшой интервал между буквами */
    }


    .sort-btn {
        background: #6c757d;
        color: white;
    }

    .sort-btn:hover {
        background: #5a6268;
    }

    .add-btn {
        background-color: #007bff;
        color: white;
    }

    .add-btn:hover {
        background-color: #0069d9;
    }

    .sort-dropdown {
        position: relative;
        display: inline-block;
    }

    .sort-menu {
        display: none;
        position: absolute;
        right: 0;
        top: 100%;
        min-width: 240px;  /* Теперь совпадает с шириной кнопки */
        background: white;
        box-shadow: 0 8px 16px rgba(0,0,0,0.15);
        border-radius: 6px;
        z-index: 1000;
        overflow: hidden;
        margin-top: 5px;
    }
    .sort-dropdown {
    position: relative;
    display: inline-block;
}
.sort-dropdown::after {
    content: '';
    position: absolute;
    bottom: -10px; /* Размер мостика */
    left: 0;
    width: 100%;
    height: 10px;
    background: transparent;
}
    .sort-dropdown:hover .sort-menu {
        display: block;
    }

    .sort-menu a {
        color: #333;
        padding: 8px 15px;  /* Уменьшены отступы */
        text-decoration: none;
        display: block;
        border-bottom: 1px solid #eee;
        font-size: 0.95rem;  /* Чуть уменьшен шрифт */
        text-align: left;
        white-space: nowrap;
    }

    .sort-menu a:last-child {
        border-bottom: none;
    }

    .sort-menu a:hover {
        background: #f8f9fa;
    }

    .sort-menu a.active {
        background: #007bff;
        color: white;
    }

    .priority-trivial {
        color: #28a745;
        font-weight: bold;
    }
    .priority-medium {
        color: #ffc107;
        font-weight: bold;
    }
    .priority-high {
        color: #fd7e14;
        font-weight: bold;
    }
    .priority-critical {
        color: #dc3545;
        font-weight: bold;
    }

    .task-meta {
        font-size: 0.9rem;
        color: #6c757d;
    }

    .modal-dialog {
        margin-top: 100px;
    }

    .btn-group {
        display: flex;
        gap: 10px;
        padding: 0 12px 12px 12px;
        justify-content: space-between;
    }

    .btn-edit {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 6px 10px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        min-width: 80px;
        text-align: center;
    }

    .btn-edit:hover {
        background-color: #0069d9;
    }

    .btn-delete {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 6px 30px;
        border-radius: 4px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 0.2s;
        flex: 0 1 auto;
        min-width: 100px;
    }

    .btn-delete:hover {
        background-color: #c82333;
    }

    .card {
        margin-bottom: 10px !important;
    }
    .card-body {
        padding: 12px !important;
    }
    .card-title {
        font-size: 1.8rem !important;
        margin-bottom: 8px !important;
        font-weight: bold;
    }
    .card-subtitle {
        font-size: 1.1rem !important;
        margin-bottom: 8px !important;
    }
    .sort-arrow {
        font-size: 14px;
        margin-left: 5px;
    }
    .search-container {
            margin: 20px 0;
            display: flex;
            gap: 0; /* Соединяем инпут и кнопку */
            max-width: 400px;
        }

        .search-input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px; /* Скругляем только левые углы */
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #007bff;
        }

        .search-btn {
            background-color: #f8f9fa;
            border: 1px solid #ccc;
            border-left: none; /* Убираем двойную границу между ними */
            padding: 0 15px;
            border-radius: 0 5px 5px 0; /* Скругляем только правые углы */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .search-btn:hover {
            background-color: #e2e6ea;
        }

        .search-btn svg {
            width: 16px;
            height: 16px;
            fill: #555;
        }
      .favorite-btn {
          background: none;
          border: none;
          font-size: 2.2rem;
          cursor: pointer;
          transition: transform 0.2s;
          padding: 0;
          line-height: 1;
          display: flex;
          align-items: center;
          justify-content: center;
      }
      .favorite-btn:hover {
          transform: scale(1.2);
      }
      .star-filled {
          color: #ffc107;
      }
      .star-empty {
          color: #ccc;
      }
      .title-wrapper {
          display: flex;
          align-items: center;
          justify-content: flex-start;
      }
    .back-to-top {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 50px;
        height: 50px;
        background-color: #007bff;
        color: white;
        border-radius: 50%;
        display: none; /* Скрипт изменит это на 'flex' при скролле */
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        border: none;
        z-index: 9999; /* Чтобы кнопка была поверх всех карточек */
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .back-to-top:hover {
        background-color: #0056b3;
        transform: translateY(-5px);
        color: white;
    }
    .status-badge {
        padding: 5px 12px;
        border-radius: 20px; /* Скругленные края (pill) */
        font-size: 0.8rem;
        font-weight: bold;
        text-transform: uppercase; /* Все буквы заглавные */
        letter-spacing: 0.5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 1;
        white-space: nowrap;
    }

    .status-new {
        background-color: #e0f2fe; /* Светло-синий */
        color: #0369a1;
        border: 1px solid #bae6fd;
    }

    .status-in_progress {
        background-color: #fffbeb; /* Светло-желтый */
        color: #a16207;
        border: 1px solid #fef3c7;
    }

    .status-testing {
        background-color: #ede9fe; /* Светло-фиолетовый */
        color: #6d28d9;
        border: 1px solid #ddd6fe;
    }

    .status-review {
        background-color: #ffedfa; /* Светло-розовый */
        color: #be185d;
        border: 1px solid #fbcfe8;
    }

    .status-completed {
        background-color: #dcfce7; /* Светло-зеленый */
        color: #15803d;
        border: 1px solid #bbf7d0;
    }
        .fu-zone {
        border: 2px dashed #dee2e6;
        border-radius: 10px;
        padding: 18px 16px;
        text-align: center;
        background: #f8f9fa;
        cursor: pointer;
        transition: border-color 0.2s, background 0.2s;
        user-select: none;
    }
    .fu-zone:hover, .fu-zone.dragover {
        border-color: #007bff;
        background: #eef6ff;
    }
    .fu-zone.dragover { border-style: solid; }
    .fu-hint { color: #6c757d; font-size: 0.85rem; pointer-events: none; }
    .fu-hint .fu-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
    .fu-preview-wrap {
        display: none; margin-top: 10px; padding: 8px 10px;
        border: 1px solid #dee2e6; border-radius: 8px; background: #fff;
        align-items: center; gap: 10px;
    }
    .fu-preview-wrap.active { display: flex; }
    .fu-thumb-btn {
        flex-shrink: 0; width: 44px; height: 44px;
        border: none; padding: 0; background: none;
        cursor: zoom-in; border-radius: 6px; overflow: hidden;
    }
    .fu-thumb-btn img {
        width: 100%; height: 100%; object-fit: cover;
        border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,0.15);
        transition: transform 0.15s;
    }
    .fu-thumb-btn:hover img { transform: scale(1.08); }
    .fu-doc-icon {
        flex-shrink: 0; width: 44px; height: 44px; background: #e9ecef;
        border-radius: 6px; display: flex; align-items: center;
        justify-content: center; font-size: 1.4rem;
    }
    .fu-filename {
        flex: 1; font-size: 0.82rem; color: #333;
        white-space: nowrap; overflow: hidden;
        text-overflow: ellipsis; text-align: left;
    }
    .fu-clear {
        flex-shrink: 0; background: none; border: none; color: #aaa;
        font-size: 1rem; cursor: pointer; padding: 2px 4px;
        line-height: 1; border-radius: 4px; transition: color 0.15s;
    }
    .fu-clear:hover { color: #dc3545; }
    .fu-lightbox {
        display: none; position: fixed; inset: 0;
        background: rgba(0,0,0,0.82); z-index: 9999;
        align-items: center; justify-content: center;
    }
    .fu-lightbox.open { display: flex; }
    .fu-lightbox img {
        max-width: 90vw; max-height: 88vh;
        border-radius: 8px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .fu-lightbox-close {
        position: absolute; top: 18px; right: 22px;
        color: #fff; font-size: 2rem; cursor: pointer;
        line-height: 1; background: none; border: none;
        opacity: 0.8; transition: opacity 0.15s;
    }
    .fu-lightbox-close:hover { opacity: 1; }
    html {
        scroll-behavior: smooth;
    }
  </style>
</head>

<body>
<header th:insert="blocks/header :: header"></header>
<aside th:insert="blocks/sidebar :: sidebar"></aside>

<div class="main-content">
  <div class="container">
    <div class="header-actions">
      <h1>Все задачи</h1>
      <div class="action-buttons">
        <div class="sort-dropdown">
          <button class="action-btn sort-btn">
            Сортировка <span class="sort-arrow">▼</span>
          </button>
          <div class="sort-menu">
            <a th:href="@{/all-tasks(sort='id_desc')}"
               th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">
              Время добавления (новые)
            </a>
            <a th:href="@{/all-tasks(sort='id_asc')}  "
               th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">
              Время добавления (старые)
            </a>
            <a th:href="@{/all-tasks(sort='deadline')} "
               th:classappend="${currentSort == 'deadline'} ? 'active' : ''">
              Дедлайн
            </a>
            <a th:href="@{/all-tasks(sort='priority')}  "
               th:classappend="${currentSort == 'priority'} ? 'active' : ''">
              Приоритет
            </a>
            <a th:href="@{/all-tasks(sort='status_asc')}"
               th:classappend="${currentSort == 'status_asc'} ? 'active' : ''">
              Статус (Новые)
            </a>
            <a th:href="@{/all-tasks(sort='status_desc')}"
               th:classappend="${currentSort == 'status_desc'} ? 'active' : ''">
              Статус (Завершенные)
            </a>
          </div>
        </div>
        <button type="button" class="action-btn add-btn" data-bs-toggle="modal" data-bs-target="#addTaskModal">
          + Добавить задачу
        </button>
      </div>
    </div>
    <div class="search-container" id="task-list">
      <form th:action="@{/all-tasks}" method="get" style="display: flex; width: 100%;">
        <input type="text" name="search" class="search-input"
               th:value="${searchQuery}" placeholder="Поиск по названию...">
        <button type="submit" class="search-btn">
          <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
          <span style="margin-left: 5px; font-weight: 500; color: #444;">Найти</span>
        </button>
      </form>
    </div>
    <div th:if="${#lists.isEmpty(tasks)}"
         style="text-align: center; padding: 50px; background: white; border-radius: 8px; border: 1px dashed #ccc; margin-top: 20px; width: 100%;">
      <h3 style="color: #6c757d;">Задача не найдена</h3>
      <p style="color: #999;">Попробуйте изменить запрос или <a th:href="@{/all-tasks}" style="color: #007bff; text-decoration: none;">сбросить поиск</a></p>
    </div>
    <div th:unless="${#lists.isEmpty(tasks)}" th:each="el : ${tasks}" class="card mb-2" th:id="'task-' + ${el.id}">
      <div class="card-body">
        <div class="title-wrapper mb-2" style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
            <h2 class="card-title mb-0" th:text="${el.title}" style="margin-right: 0 !important;"></h2>

            <span class="status-badge"
                  th:classappend="'status-' + ${#strings.toLowerCase(el.status)}"
                  th:text="${el.status}">
            </span>
          </div>
          <form th:action="@{/favorites/toggle/{id}(id=${el.id})}" method="post">
            <button type="submit" class="favorite-btn" style="margin-right: 0;">
              <span th:if="${currentUser != null and currentUser.favouriteTasks.contains(el)}" class="star-filled">★</span>
              <span th:unless="${currentUser != null and currentUser.favouriteTasks.contains(el)}" class="star-empty">☆</span>
            </button>
          </form>
        </div>
        <h6 class="card-subtitle mb-3" th:text="${el.priority}"
            th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}">
        </h6>

        <div class="d-flex justify-content-between align-items-center mb-3">
        <span>
            <strong>Исполнитель:</strong>
            <span th:if="${users != null and !#lists.isEmpty(users)}">
                <span th:each="user : ${users}" th:if="${user.id == el.artistId}"
                      th:text="${user.firstName + ' ' + user.lastName}"></span>
            </span>
            <span th:if="${el.artistId == null}">Не назначен</span>
        </span>
          <span>Дедлайн: <strong th:text="${#temporals.format(el.deadline, 'dd.MM.yyyy HH:mm')}"></strong></span>
        </div>
        <div th:if="${el.comment != null and el.comment != ''}" class="mb-3">
          <p class="text-secondary mb-0" th:text="${el.comment}"></p>
        </div>

        <div class="btn-group-container d-flex gap-2">
          <button type="button"
                  class="btn-edit"
                  data-bs-toggle="modal"
                  data-bs-target="#editTaskModal"
                  th:data-task-id="${el.id}"
                  th:data-task-title="${el.title}"
                  th:data-task-priority="${el.priority}"
                  th:data-task-status="${el.status}"
                  th:data-task-artist="${el.artistId}"
                  th:data-task-deadline="${el.deadline != null ? #temporals.format(el.deadline, &quot;yyyy-MM-dd'T'HH:mm&quot;) : ''}"
                  th:data-task-comment="${el.comment} ?: ''"
                  th:data-current-sort="${currentSort}"
                  th:data-task-version="${el.version}"
                  onclick="fillEditModal(this)">
            Редактировать
          </button>
          <form th:action="@{/all-tasks/delete/{id}(id=${el.id}, sort=${currentSort})}"
                method="post"
                style="display: inline;"
                onsubmit="return confirm('Вы уверены, что хотите удалить эту задачу?');">
            <button type="submit" class="btn-delete" style="padding: 6px 20px;">
              Удалить
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" id="addTaskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Добавить задачу</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form th:action="@{/all-tasks}" method="post" enctype="multipart/form-data">
          <div class="mb-3">
            <label class="form-label">Название задачи</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Приоритет</label>
            <select name="priority" class="form-select">
              <option value="TRIVIAL">Низкий</option>
              <option value="MEDIUM">Средний</option>
              <option value="HIGH">Высокий</option>
              <option value="CRITICAL">Критичный</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Исполнитель</label>
            <select name="artistId" class="form-select" required>
              <option value="" disabled selected>Выберите исполнителя</option>
              <option th:each="user :${users}"
                      th:value="${user.id}"
                      th:text="${user.firstName + ' ' + user.lastName}">
              </option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Дедлайн</label>
            <input type="datetime-local" name="deadline" min="2024-01-01T00:00" max="2099-12-31T23:59" required>
          </div>

          <div class="mb-3">
            <label class="form-label">Комментарий</label>
            <textarea name="comment" class="form-control" rows="2" placeholder="Опишите задачу"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label text-muted small fw-bold">Прикрепить файл</label>
            <div id="add-drop-zone" class="fu-zone"
                 onclick="fuZoneClick('add')"
                 ondragover="fuDragOver(event,'add')"
                 ondragleave="fuDragLeave('add')"
                 ondrop="fuDrop(event,'add')">
              <div class="fu-hint">
                <span class="fu-icon">📎</span>
                Перетащите файл, нажмите или вставьте <kbd>Ctrl+V</kbd>
              </div>
              <input type="file" name="files" id="add-file-input" class="d-none" multiple onchange="fuFromInput(this,'add')">
              <div id="add-fu-preview-list" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;"></div>
            </div>
            <div id="add-fu-preview" class="fu-preview-wrap">
              <button type="button" class="fu-thumb-btn" id="add-fu-thumb-btn"
                      onclick="fuOpenLightbox('add')" title="Просмотреть">
                <img id="add-fu-thumb" src="" alt="">
              </button>
              <span class="fu-doc-icon d-none" id="add-fu-doc-icon">📄</span>
              <span class="fu-filename" id="add-fu-name"></span>
              <button type="button" class="fu-clear" onclick="fuClear('add')" title="Убрать файл">✕</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Добавить</button>
        </form>
      </div>
    </div>
  </div>
</div>
<button onclick="scrollToTop()" id="backToTopBtn" class="back-to-top" title="Наверх">
  ↑
</button>
<div id="fu-lightbox" class="fu-lightbox" onclick="fuCloseLightbox(event)">
  <button class="fu-lightbox-close" onclick="fuCloseLightbox()">&times;</button>
  <img id="fu-lightbox-img" src="" alt="">
</div>
<div th:insert="blocks/modals :: editTaskModal"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  function fillEditModal(button) {

      const form = document.querySelector('#editTaskModal form');
      const currentPath = window.location.pathname;
      if (currentPath.includes('/user-tasks')) {
          form.action = '/all-tasks/update';
      } else {
          form.action = '/all-tasks/update';
      }
      document.getElementById('editTaskId').value = button.getAttribute('data-task-id');
      document.getElementById('editTaskReturnUrl').value = currentPath;
      document.getElementById('editTaskTitle').value = button.getAttribute('data-task-title');
      document.getElementById('editTaskPriority').value = button.getAttribute('data-task-priority');
      document.getElementById('editTaskArtist').value = button.getAttribute('data-task-artist');
      document.getElementById('editTaskDeadline').value = button.getAttribute('data-task-deadline');
      document.getElementById('editTaskComment').value = button.getAttribute('data-task-comment') || '';
      document.getElementById('editTaskVersion').value = button.getAttribute('data-task-version') || 0;
      const fileStores = {
        add: new DataTransfer(),
        edit: new DataTransfer()
       };
      function fuSetFile(file, prefix) {
          if (!file) return;

          fileStores[prefix].items.add(file);

          const input = document.getElementById(prefix + '-file-input');
          input.files = fileStores[prefix].files;
          renderPreviews(prefix);
      }
      function renderPreviews(prefix) {
          const listContainer = document.getElementById(prefix + '-fu-preview-list');
          listContainer.innerHTML = ''; // Очищаем
          const files = fileStores[prefix].files;

          for (let i = 0; i < files.length; i++) {
              const file = files[i];
              const itemHtml = `<div class="fu-preview-wrap active">
                  <span class="fu-filename">${file.name}</span>
                  <button type="button" class="fu-clear" onclick="removeFile(${i}, '${prefix}')">✕</button>
              </div>`;
              listContainer.insertAdjacentHTML('beforeend', itemHtml);
          }
      }
      function removeFile(index, prefix) {
          const store = fileStores[prefix];
          const newStore = new DataTransfer();

          // Копируем все файлы, кроме удаляемого
          for (let i = 0; i < store.files.length; i++) {
              if (i !== index) newStore.items.add(store.files[i]);
          }
          fileStores[prefix] = newStore;

          // Обновляем input и перерисовываем
          document.getElementById(prefix + '-file-input').files = newStore.files;
          renderPreviews(prefix);
      }

      const statusField = document.getElementById('editTaskStatus');
      if (statusField) {
          statusField.value = button.getAttribute('data-task-status') || 'NEW';
      }
      fuClear('edit');
  }



    const mybutton = document.getElementById("backToTopBtn");

    window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            mybutton.style.display = "flex";
        } else {
            mybutton.style.display = "none";
        }
    };

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }
    function fuClear(prefix) {
        fileStores[prefix] = new DataTransfer();
        document.getElementById(prefix + '-file-input').value = '';
        document.getElementById(prefix + '-fu-preview-list').innerHTML = '';
    }

  document.addEventListener('DOMContentLoaded', function() {
    const addModal = document.getElementById('addTaskModal');
    if (addModal) {
        addModal.addEventListener('hidden.bs.modal', function() {
            document.getElementById('addTaskFileInput').value = '';
            document.getElementById('addFileHelp').textContent = '';
        });
    }
});
function fuSetFile(file, prefix) {
        if (!file) return;
        const input    = document.getElementById(prefix + '-file-input');
        const preview  = document.getElementById(prefix + '-fu-preview');
        const nameEl   = document.getElementById(prefix + '-fu-name');
        const thumb    = document.getElementById(prefix + '-fu-thumb');
        const thumbBtn = document.getElementById(prefix + '-fu-thumb-btn');
        const docIcon  = document.getElementById(prefix + '-fu-doc-icon');

        const dt = new DataTransfer();
        dt.items.add(file);
        input.files = dt.files;

        nameEl.textContent = file.name || 'clipboard_image.png';
        preview.classList.add('active');

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = e => {
                thumb.src = e.target.result;
                thumb.dataset.fullSrc = e.target.result;
            };
            reader.readAsDataURL(file);
            thumbBtn.classList.remove('d-none');
            docIcon.classList.add('d-none');
        } else {
            thumbBtn.classList.add('d-none');
            docIcon.classList.remove('d-none');
            const icons = {
                pdf:  'bi-file-earmark-pdf',
                doc:  'bi-file-earmark-word',
                docx: 'bi-file-earmark-word',
                xls:  'bi-file-earmark-excel',
                xlsx: 'bi-file-earmark-excel',
                zip:  'bi-file-earmark-zip',
                rar:  'bi-file-earmark-zip',
                txt:  'bi-file-earmark-text',
            };
            const ext = (file.name.split('.').pop() || '').toLowerCase();
            const iconClass = icons[ext] || 'bi-file-earmark';
            docIcon.innerHTML = `<i class="bi ${iconClass}"></i>`;
        }
    }

    function fuClear(prefix) {
        const input   = document.getElementById(prefix + '-file-input');
        const preview = document.getElementById(prefix + '-fu-preview');
        const thumb   = document.getElementById(prefix + '-fu-thumb');
        if (input)   input.value = '';
        if (preview) preview.classList.remove('active');
        if (thumb)   { thumb.src = ''; thumb.dataset.fullSrc = ''; }
    }

    function fuZoneClick(prefix) {
        document.getElementById(prefix + '-file-input').click();
    }
    function fuFromInput(input, prefix) {
        if (input.files && input.files[0]) fuSetFile(input.files[0], prefix);
    }
    function fuDragOver(e, prefix) {
        e.preventDefault();
        document.getElementById(prefix + '-drop-zone').classList.add('dragover');
    }
    function fuDragLeave(prefix) {
        document.getElementById(prefix + '-drop-zone').classList.remove('dragover');
    }
    function fuDrop(e, prefix) {
        e.preventDefault();
        document.getElementById(prefix + '-drop-zone').classList.remove('dragover');
        const file = e.dataTransfer.files[0];
        if (file) fuSetFile(file, prefix);
    }

    document.addEventListener('paste', function(e) {
    let prefix = null;
    if (document.getElementById('editTaskModal')?.classList.contains('show')) prefix = 'edit';
    else if (document.getElementById('addTaskModal')?.classList.contains('show')) prefix = 'add';
    if (!prefix) return;

    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
    for (const item of items) {
        if (item.kind === 'file') {
            const rawFile = item.getAsFile();

            // Если вставлена картинка из буфера — делаем ей красивое имя
            const ext = rawFile.type.split('/')[1] || 'png';
            const prettyName = `screenshot_${Date.now()}.${ext}`;
            const screenshotFile = new File([rawFile], prettyName, { type: rawFile.type });

            fuSetFile(screenshotFile, prefix);
            break;
        }
    }
});

    document.addEventListener('DOMContentLoaded', function() {
        ['editTaskModal', 'addTaskModal'].forEach(function(id) {
            const el = document.getElementById(id);
            if (el) {
                el.addEventListener('hidden.bs.modal', function() {
                    fuClear(id === 'editTaskModal' ? 'edit' : 'add');
                });
            }
        });
    });

    function fuOpenLightbox(prefix) {
        const thumb = document.getElementById(prefix + '-fu-thumb');
        const src = thumb?.dataset?.fullSrc || thumb?.src;
        if (!src) return;
        document.getElementById('fu-lightbox-img').src = src;
        document.getElementById('fu-lightbox').classList.add('open');
    }
    function fuCloseLightbox(e) {
        if (e && e.target !== e.currentTarget && e.target.tagName === 'IMG') return;
        document.getElementById('fu-lightbox').classList.remove('open');
    }
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') fuCloseLightbox();
    });
</script>
