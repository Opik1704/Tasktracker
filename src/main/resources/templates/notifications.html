<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Уведомления</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .filters {
            margin-bottom: 15px;
        }
        .filters a {
            margin-right: 10px;
            padding: 4px 10px;
            border-radius: 4px;
            text-decoration: none;
            color: #333;
            border: 1px solid #ccc;
        }
        .filters a.active {
            background: #9e9e9e;
            color: white;
        }
        .notification {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        .notification.unread {
            background-color: #eef6ff;
            font-weight: bold;
        }
        .notification .message {
            flex: 1;
            margin-right: 10px;
        }
        .notification .date {
            color: #777;
            font-size: 12px;
            margin-right: 10px;
            white-space: nowrap;
        }
        .notification form {
            margin: 0;
        }
        .notification button {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
        }
        .empty {
            color: #777;
            padding: 20px 0;
        }
        .pagination {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .pagination a {
            padding: 6px 12px;
            background: #9e9e9e;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .pagination span {
            align-self: center;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>Уведомления</h1>

    <div class="filters">
        <a th:href="@{/notifications(page=0, size=20)}"
           th:classappend="${readFilter == null} ? 'active'">Все</a>
        <a th:href="@{/notifications(page=0, size=20, read=false)}"
           th:classappend="${readFilter != null and !readFilter} ? 'active'">Непрочитанные</a>
        <a th:href="@{/notifications(page=0, size=20, read=true)}"
           th:classappend="${readFilter != null and readFilter} ? 'active'">Прочитанные</a>
    </div>

    <div th:if="${notifications.empty}" class="empty">
        Уведомлений нет.
    </div>

    <div th:each="notification : ${notifications.content}" class="notification"
         th:classappend="${notification.read} ? '' : 'unread'">
        <span class="message" th:text="${notification.message}">Сообщение</span>
            <span class="date" th:text="${#temporals.format(notification.createdAt, 'dd.MM.yyyy HH:mm')}">01.01.2026 12:00</span>

            <form th:if="${!notification.read}" th:action="@{/notifications/{id}/read(id=${notification.id})}" method="post">
                <button type="submit">Прочитано</button>
            </form>

            <form th:action="@{/notifications/{id}/delete(id=${notification.id})}" method="post">
                <button type="submit">Удалить</button>
            </form>
        </div>
    </div>

    <div class="pagination" th:if="${notifications.totalPages > 1}">
        <a th:if="${notifications.hasPrevious()}"
           th:href="@{/notifications(page=${notifications.number - 1}, size=${notifications.size}, read=${readFilter})}">Назад</a>
        <span th:text="'Страница ' + ${notifications.number + 1} + ' из ' + ${notifications.totalPages}"></span>
        <a th:if="${notifications.hasNext()}"
           th:href="@{/notifications(page=${notifications.number + 1}, size=${notifications.size}, read=${readFilter})}">Вперёд</a>
    </div>
</div>
</body>
</html>
