<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Default Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .main-content {
            margin-left: 250px;
            padding: 40px;
            min-height: 100vh;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <header th:insert="~{blocks/header :: header}"></header>
    <aside th:insert="~{blocks/sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="container">
            <h1>Добро пожаловать,
                <span th:text="${currentUser != null ? currentUser.firstName + ' ' + currentUser.lastName : 'Гость'}"></span>!
            </h1>
            <p class="lead">Здесь что то будет Статистика там за месяц, или пожелание отпуска </p>
        </div>
    </main>
</body>
</html>
