<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title th:text="${title}">Default Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        .main-content {
            margin-left: 250px;
            padding: 40px;
            min-height: 100vh;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }
    </style>
</head>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<body>
    <header th:insert="~{blocks/header :: header}"></header>
    <aside th:insert="~{blocks/sidebar :: sidebar}"></aside>
    <main class="main-content">
        <div class="container">
            <h1>Добро пожаловать,
                <span th:text="${currentUser != null ? currentUser.firstName + ' ' + currentUser.lastName : 'Гость'}"></span>!
            </h1>
            <div th:if="${statistics != null}" class="statistics-card">
                <h2>Ваша статистика</h2>
                <div class="stat-grid">
                    <div class="stat-item">
                        <span class="stat-label">Завершено задач:</span>
                        <span class="stat-value" th:text="${statistics.totalCompleted}">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Среднее время выполнения (ч):</span>
                        <span class="stat-value" th:text="${statistics.averageCompletionHours}">0.00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Самая быстрая задача:</span>
                        <span class="stat-value" th:text="${statistics.fastestCompletedTask != null ? statistics.fastestCompletedTask.title : '—'}">—</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Завершено за неделю:</span>
                        <span class="stat-value" th:text="${statistics.completedThisWeek}">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Завершено за месяц:</span>
                        <span class="stat-value" th:text="${statistics.completedThisMonth}">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Выполнено в срок:</span>
                        <span class="stat-value" th:text="${statistics.onTimePercentage}">0</span>%
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
