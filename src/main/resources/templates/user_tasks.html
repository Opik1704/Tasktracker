<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Мои задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
         }
        body {
         font-family: Arial, sans-serif;
         background-color: #f5f5f5;
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         }

        .main-content {
         display: flex;
         flex: 1;
         margin-left: 250px;
         padding: 25px;
             }
        .container { flex: 1;
         }

        h1 { font-size: 3.1rem !important;
        font-weight: bold !important;
        color: #444 !important;
         margin-bottom: 25px;
        }
        .header-actions {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        margin-bottom: 20px; }
        /* Стили кнопок */
        .action-btn {
            height: 50px; padding: 0 35px; border: none; border-radius: 8px;
            font-size: 1.15rem; font-weight: 500; cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; min-width: 240px; transition: all 0.2s;
        }
        .sort-btn {
         background: #6c757d;
         color: white;
         }
        .sort-btn:hover {
         background: #5a6268;
         }

        /* Выпадающее меню сортировки */
        .sort-dropdown { position: relative; display: inline-block; }
        .sort-dropdown::after { content: ''; position: absolute; bottom: -10px; left: 0; width: 100%; height: 10px; background: transparent; }
        .sort-dropdown:hover .sort-menu { display: block; }
        .sort-menu {
            display: none; position: absolute; right: 0; top: 100%; min-width: 240px;
            background: white; box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            border-radius: 6px; z-index: 1000; overflow: hidden; margin-top: 5px;
        }
        .sort-menu a {
            color: #333; padding: 12px 15px; text-decoration: none; display: block;
            border-bottom: 1px solid #eee; font-size: 0.95rem; text-align: left;
        }
        .sort-menu a:hover { background: #f8f9fa; }
        .sort-menu a.active { background: #007bff; color: white; }

        /* Поиск */
        .search-container {
         margin: 20px 0;
         display: flex;
         max-width: 400px;
         }
        .search-input {
            flex: 1; padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }
        .search-btn {
            background-color: #f8f9fa; border: 1px solid #ccc; border-left: none;
            padding: 0 15px; border-radius: 0 5px 5px 0; cursor: pointer;
            display: flex; align-items: center;
        }

        /* Приоритеты */
        .priority-trivial { color: #28a745; font-weight: bold; }
        .priority-medium { color: #ffc107; font-weight: bold; }
        .priority-high { color: #fd7e14; font-weight: bold; }
        .priority-critical { color: #dc3545; font-weight: bold; }

        /* Карточки */
        .card { margin-bottom: 10px !important; border: 1px solid #ddd; }
        .card-body { padding: 15px !important; }
        .card-title { font-size: 1.8rem !important; font-weight: bold; margin-bottom: 8px;
         }
         .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            background-color: #007bff; /* Синий цвет как у твоих кнопок */
            color: white;
            border-radius: 50%;
            display: none; /* Скрыта по умолчанию, скрипт её покажет */
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            z-index: 1000;
            cursor: pointer;
            border: none;
        }

        .back-to-top:hover {
            background-color: #0056b3;
            transform: translateY(-5px);
            color: white;
        }
        /* --- Стили для бейджей статусов (добавить в style) --- */
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px; /* Скругленные края (pill) */
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase; /* Все буквы заглавные */
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            white-space: nowrap;
        }

        /* Цвета для каждого статуса */
        .status-new {
            background-color: #e0f2fe; /* Светло-синий */
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        .status-in_progress {
            background-color: #fffbeb; /* Светло-желтый */
            color: #a16207;
            border: 1px solid #fef3c7;
        }

        .status-testing {
            background-color: #ede9fe; /* Светло-фиолетовый */
            color: #6d28d9;
            border: 1px solid #ddd6fe;
        }

        .status-review {
            background-color: #ffedfa; /* Светло-розовый */
            color: #be185d;
            border: 1px solid #fbcfe8;
        }

        .status-completed {
            background-color: #dcfce7; /* Светло-зеленый */
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        /* Чтобы скролл был плавным, а не резким прыжком */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>

<header th:insert="~{blocks/header :: header}"></header>
<aside th:insert="~{blocks/sidebar :: sidebar}"></aside>

<div class="main-content">
    <div class="container">
        <div class="header-actions">
            <div class="d-flex align-items-center gap-3">
                <h1 class="mb-0">Мои задачи</h1>
                <span th:unless="${#lists.isEmpty(tasks)}" class="badge bg-info text-dark"
                      style="font-size: 1rem; padding: 8px 12px;" th:text="${tasks.size() + ' задач'}"></span>
            </div>

            <div class="sort-dropdown">
                <button class="action-btn sort-btn">
                    Сортировка <span class="sort-arrow">▼</span>
                </button>
                <div class="sort-menu">
                    <a th:href="@{/user-tasks(sort='id_desc')}" th:classappend="${currentSort == 'id_desc'} ? 'active' : ''">Новые</a>
                    <a th:href="@{/user-tasks(sort='id_asc')}" th:classappend="${currentSort == 'id_asc'} ? 'active' : ''">Старые</a>
                    <a th:href="@{/user-tasks(sort='deadline')}" th:classappend="${currentSort == 'deadline'} ? 'active' : ''">Дедлайн</a>
                    <a th:href="@{/user-tasks(sort='priority')}" th:classappend="${currentSort == 'priority'} ? 'active' : ''">Приоритет</a>
                    <a th:href="@{/user-tasks(sort='status_asc')}" th:classappend="${currentSort == 'status_asc'} ? 'active' : ''"> Статус (Новые)</a>
                    <a th:href="@{/user-tasks(sort='status_desc')}" th:classappend="${currentSort == 'status_desc'} ? 'active' : ''">Статус (Завершенные)</a>
                </div>
            </div>
        </div>

        <div class="search-container">
            <form th:action="@{/user-tasks}" method="get" style="display: flex; width: 100%;">
                <input type="text" name="search" class="search-input"
                       th:value="${search}" placeholder="Поиск в моих задачах...">
                <button type="submit" class="search-btn">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#555"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                    <span style="margin-left: 8px; font-weight: 500; color: #444;">Найти</span>
                </button>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(tasks)}"
             style="text-align: center; padding: 50px; background: white; border-radius: 8px; border: 1px dashed #ccc; margin-top: 20px; width: 100%;">
            <h3 style="color: #6c757d;"> Задача не найдена</h3>
            <p style="color: #999;">Попробуйте изменить запрос или <a th:href="@{/user-tasks}">сбросить поиск</a></p>
        </div>

        <div th:unless="${#lists.isEmpty(tasks)}" th:each="el : ${tasks}" class="card shadow-sm mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <div style="flex: 1;">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 5px;">
                            <h2 class="card-title mb-0" th:text="${el.title}" style="margin-right: 0 !important;"></h2>

                            <span class="status-badge"
                                  th:classappend="'status-' + ${#strings.toLowerCase(el.status)}"
                                  th:text="${el.status}">
                            </span>
                        </div>

                        <h6 class="card-subtitle mb-2" th:text="${el.priority}"
                            th:classappend="'priority-' + ${#strings.toLowerCase(el.priority)}"
                            style="margin-top: 0 !important;">
                        </h6>
                    </div>

                    <form th:action="@{/favorites/toggle/{id}(id=${el.id})}" method="post"
                          th:onsubmit="return confirm('Убрать задачу «' + [[${el.title}]] + '» из избранного?');">
                        <button type="submit" class="favorite-btn" style="background: none; border: none; font-size: 2.2rem; cursor: pointer; padding: 0; line-height: 1; color: #ffc107;">
                            ★
                        </button>
                    </form>
                </div>

                <p class="text-secondary" th:text="${el.comment}" th:if="${el.comment != null and el.comment != ''}"></p>

                <div class="d-flex justify-content-between align-items-end mt-3">
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-primary btn-sm" style="min-width: 120px;"
                                data-bs-toggle="modal" data-bs-target="#editTaskModal"
                                th:data-task-id="${el.id}" th:data-task-title="${el.title}"
                                th:data-task-priority="${el.priority}"
                                th:data-task-deadline="${el.deadline != null ? #temporals.format(el.deadline, 'yyyy-MM-dd''T''HH:mm') : ''}"
                                th:data-task-comment="${el.comment}" onclick="fillEditModal(this)"
                                th:data-task-artist="${el.artistId}"
                                th:data-task-status="${el.status}">
                            Редактировать
                        </button>
                        <form th:action="@{/all-tasks/delete/{id}(id=${el.id}, sort=${currentSort})}" method="post"
                              onsubmit="return confirm('Удалить задачу?');">
                            <button type="submit" class="btn btn-danger btn-sm" style="min-width: 120px;">Удалить</button>
                        </form>
                    </div>

                    <div class="text-end">
                        <small class="text-muted d-block">Дедлайн:</small>
                        <strong th:text="${el.deadline != null ? #temporals.format(el.deadline, 'dd.MM.yyyy HH:mm') : 'Срок не задан' }"></strong>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<button onclick="scrollToTop()" id="backToTopBtn" class="back-to-top" title="Наверх">
    ↑
</button>
<div th:insert="blocks/modals :: editTaskModal"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function fillEditModal(button) {
        clearEditFile();

        const form = document.querySelector('#editTaskModal form');
        const currentPath = window.location.pathname;
          if (currentPath.includes('/user-tasks')) {
              form.action = '/all-tasks/update';
          } else {
              form.action = '/all-tasks/update';
          }

        document.getElementById('editTaskReturnUrl').value = currentPath;

        document.getElementById('editTaskId').value = button.getAttribute('data-task-id');
        document.getElementById('editTaskTitle').value = button.getAttribute('data-task-title');
        document.getElementById('editTaskPriority').value = button.getAttribute('data-task-priority');
        document.getElementById('editTaskArtist').value = button.getAttribute('data-task-artist');
        document.getElementById('editTaskDeadline').value = button.getAttribute('data-task-deadline');
        document.getElementById('editTaskComment').value = button.getAttribute('data-task-comment') || ''

        const statusField = document.getElementById('editTaskStatus');
        if (statusField) {
            statusField.value = button.getAttribute('data-task-status') || 'NEW';
        };
    }

    function clearEditFile() {
        const fileInput = document.getElementById('edit-file-input');
        const preview = document.getElementById('edit-preview');
        if (fileInput) fileInput.value = '';
        if (preview) preview.classList.add('d-none');
    }

    const mybutton = document.getElementById("backToTopBtn");
    window.onscroll = function() {
        if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
            mybutton.style.display = "flex";
        } else {
            mybutton.style.display = "none";
        }
    };

    function scrollToTop() {
        window.scrollTo({
            top: 0,
            behavior: 'smooth'
        });
    }

    document.addEventListener('paste', (event) => {
        const modal = document.getElementById('editTaskModal');
        if (!modal.classList.contains('show')) return;
        const items = (event.clipboardData || event.originalEvent.clipboardData).items;
        for (const item of items) {
            if (item.kind === 'file') {
                const blob = item.getAsFile();
                handleFileSelection(blob, 'edit', true);
            }
        }
    });

    document.addEventListener('DOMContentLoaded', function() {
        const editFileInput = document.getElementById('edit-file-input');
        if (editFileInput) {
            editFileInput.addEventListener('change', function(e) {
                if (this.files && this.files[0]) {
                    handleFileSelection(this.files[0], 'edit');
                }
            });
        }
    });

    function handleFileSelection(file, type, isPasted = false) {
        const fileInput = document.getElementById(type + '-file-input');
        const preview = document.getElementById(type + '-preview');
        const previewImg = document.getElementById(type + '-preview-img');
        const fileNameDisplay = document.getElementById(type + '-file-name');

        const dataTransfer = new DataTransfer();
        dataTransfer.items.add(file);
        fileInput.files = dataTransfer.files;

        fileNameDisplay.innerText = file.name || "pasted_image.png";
        preview.classList.remove('d-none');

        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
    }
</script>

</body>
</html>
