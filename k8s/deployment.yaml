apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskmanager-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskmanager-app
  template:
    metadata:
      labels:
        app: taskmanager-app
    spec:
      containers:
      - name: taskmanager-app
        image: docker.io/library/webappii-taskmanager-app:latest
        imagePullPolicy: Never
        ports:
          - containerPort: 1024
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: DB_URL
          valueFrom:
            configMapKeyRef:
               name: taskmanager-config
               key: DB_URL
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: taskmanager-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: taskmanager-secret
              key: DB_PASSWORD
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 1024
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 1024
          initialDelaySeconds: 15
          periodSeconds: 5