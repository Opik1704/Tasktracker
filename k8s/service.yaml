apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: taskmanager-service
spec:
  type: NodePort
  sessionAffinity: ClientIP
  selector:
    app: taskmanager-app
  ports:
  - port: 80
    targetPort: 1024
    nodePort: 30081